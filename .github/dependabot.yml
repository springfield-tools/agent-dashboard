version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    ignore:
      # 10.x requires conventional-changelog-writer@9; @semantic-release/release-notes-generator 14.x still pulls writer@8.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: ["version-update:semver-major"]
    groups:
      production-npm:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-npm:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "fix"
      include: "scope"
    groups:
      rust-crates:
        update-types:
          - minor
          - patch
