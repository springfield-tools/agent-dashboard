name: Release Tauri

# Manual rebuild when the macOS upload failed after semantic-release created the tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to rebuild (e.g. v0.2.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-tauri-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish-macos:
    runs-on: macos-latest
    steps:
      - id: release-secrets
        env:
          RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$RELEASE_APP_ID" ] || [ -z "$RELEASE_APP_PRIVATE_KEY" ]; then
            echo "Release GitHub App secrets are not set."
            exit 1
          fi

      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: corepack enable

      - run: yarn install --immutable

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          tagName: ${{ inputs.tag }}
          releaseDraft: false
          prerelease: ${{ contains(inputs.tag, '-') }}
          args: --target aarch64-apple-darwin
