[package]
name = "agent-dashboard"
version = "0.1.0"
description = "Agent Dashboard menu-bar app"
authors = ["Bryan Hunt"]
license = "MIT"
edition = "2021"
rust-version = "1.85.0"
autobins = false
default-run = "AgentDashboard"

[[bin]]
name = "AgentDashboard"
path = "src/main.rs"

[lib]
name = "agent_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.9.5", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2.5.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
