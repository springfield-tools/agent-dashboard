[package]
name = "agent-dashboard"
version = "0.1.0"
description = "Agent Dashboard menu-bar app"
authors = ["Bryan Hunt"]
license = "MIT"
edition = "2021"
rust-version = "1.90.0"
autobins = false
default-run = "AgentDashboard"

[[bin]]
name = "AgentDashboard"
path = "src/main.rs"

[lib]
name = "agent_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
toml_edit = "0.22"
tauri = { version = "2.9.5", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2.5.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }

[dev-dependencies]
httpmock = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
block2 = "0.6.2"
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.2", features = ["NSWorkspace"] }
objc2-foundation = { version = "0.3.2", features = ["NSNotification", "block2", "NSOperation", "NSString"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
